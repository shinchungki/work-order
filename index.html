<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>업무지시서</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column of work tickets; sticky header with who-am-I; admin gets tabs (새 지시 / 지시 목록) */
:root{color-scheme:light;
  --bg:#eef1f4; --surface:#ffffff; --ink:#111827; --muted:#4b5563; --line:#c3cad3;
  --accent:#0b5d48; --accent-ink:#ffffff; --accent-soft:#d9f0e6;
  --warn:#8f3d00; --warn-soft:#ffe8cc; --bad:#b00020; --bad-soft:#fde0e0;
  --ok:#12612f; --ok-soft:#d5f2df; --info:#174a9c; --info-soft:#dbe8ff;
  --font:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand small{font-weight:500;color:var(--muted);font-size:14px;margin-left:6px}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:16px}
h1,h2,h3{text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:22px}
h3{font-size:17px}
.muted{color:var(--muted)}
.small{font-size:15px}
button,.btn{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;min-height:40px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px 10px;min-height:32px}
button.danger{color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
input[type=text],input[type=password],input[type=date],textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
textarea{min-height:64px;resize:vertical}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.field>.lab{font-weight:700;font-size:17px}
.field .hint{font-weight:400;color:var(--muted);font-size:14px;margin-left:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:16px;min-height:40px;user-select:none}
.chip input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.chip input:checked+span::before{content:"✓";color:var(--accent);font-weight:700}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.team-block{display:flex;flex-direction:column;gap:6px}
.team-block .tn{font-size:14px;color:var(--muted);letter-spacing:.04em}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{border:none;border-bottom:3px solid transparent;border-radius:0;background:transparent;padding:10px 14px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap}
.s-대기{background:var(--line);color:var(--muted)}
.s-접수{background:var(--info-soft);color:var(--info)}
.s-진행중{background:var(--warn-soft);color:var(--warn)}
.s-완료{background:var(--ok-soft);color:var(--ok)}
.s-문제발생{background:var(--bad-soft);color:var(--bad)}
.p-긴급{color:var(--bad);font-weight:700}
.p-높음{color:var(--warn);font-weight:600}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ticket.urgent{border-left:4px solid var(--bad)}
.ticket>summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.ticket>summary::-webkit-details-marker{display:none}
.ticket .no{font-family:var(--mono);font-size:14px;color:var(--muted)}
.ticket .tt{font-weight:700;font-size:19px;min-width:0;overflow-wrap:anywhere}
.ticket .meta{grid-column:1/-1;font-size:15px;color:var(--muted);display:flex;gap:4px 12px;flex-wrap:wrap}
.ticket .body{border-top:1px dashed var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:14px}
dl.kv{display:grid;grid-template-columns:7em 1fr;gap:6px 12px;margin:0;font-size:16px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.must{display:flex;gap:6px;flex-wrap:wrap}
.must span{font-size:14px;padding:2px 8px;border:1px solid var(--warn);color:var(--warn);border-radius:6px}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hist li{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:16px;padding:8px 10px;background:var(--bg);border-radius:8px}
.hist .when{grid-column:2;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.copybox{white-space:pre-wrap;font-size:16px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:320px;overflow:auto;overflow-wrap:anywhere}
.banner{padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:16px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.counts{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:16px;z-index:20}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.names button{text-align:left;padding:12px 14px;min-height:56px}
.names button b{display:block}
.names button small{color:var(--muted)}
.boss{border-color:var(--accent);background:var(--accent-soft)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:16px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.tabs{flex-wrap:wrap}.tabs button{white-space:nowrap}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
button.cal{min-height:52px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;font-size:15px;border-radius:8px}
button.cal b{font-size:14px}button.cal:disabled{opacity:.55;cursor:default}
table.board{width:100%;border-collapse:collapse;font-size:16px}.board th,.board td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line)}.board th:first-child,.board td:first-child{text-align:left}
select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:44px}
header.top{background:var(--accent);border-bottom:0;color:#fff}
body::before{background:var(--accent)}
header.top .brand small,header.top .muted{color:#e3f4ec}
header.top button.ghost{color:#fff;border-color:#ffffff99}
button{min-height:46px;font-weight:600}
button:not(.ghost):not(.primary):not(.danger):not([role=tab]):not(.cal):not(:disabled){border-color:#8f9aa8}
input[type=text],input[type=password],input[type=date],input[type=number],textarea{border:1.5px solid #8f9aa8}
.chip span{min-height:46px;font-size:16px;border:1.5px solid #8f9aa8}
.chip input:checked+span{background:var(--accent);border-color:var(--accent);color:#fff}
.chip input:checked+span::before{color:#fff}
.ticket{border:1.5px solid var(--line);box-shadow:0 1px 3px #1118271f}
.tabs{gap:6px;border-bottom:0}.tabs button{border:1.5px solid #8f9aa8;border-radius:10px;background:var(--surface);color:var(--ink);padding:8px 14px}
.tabs button[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.s-대기{background:#dfe3e8;color:#374151}.pill{padding:4px 12px}
@media (max-width:480px){dl.kv{grid-template-columns:5em 1fr}.brand small,.who .muted{display:none}header.top .in{flex-wrap:nowrap}.ticket .body{padding:14px 12px}}
</style>
</head>
<body>

<header class="top"><div class="in">
  <div class="brand">업무지시서<small>조리·생산 현장</small></div>
  <div class="who" id="who"></div>
</div></header>
<main class="wrap" id="app">
  <div class="empty">불러오는 중입니다…</div>
</main>
<div class="toast" id="toast" hidden></div>

<script>
const PAGE_URL = location.origin + location.pathname;
const SB_URL = "https://rjtcbntsuboozreqycpp.supabase.co/rest/v1/";
const SB_KEY = "sb_publishable__56a4xs6zX7yw05utEIc_A_0b7YW-QT"; // 공개용 키
async function rpc(fn, args){
  const res = await fetch(SB_URL + "rpc/" + fn, { method: "POST", cache: "no-store", headers: { apikey: SB_KEY, "Content-Type": "application/json" }, body: JSON.stringify(args || {}) });
  if (!res.ok) throw new Error(res.status);
  return res.json();
}
let sends = [];
const SEND_LABEL = { pending: "카톡 대기", sending: "카톡 보내는 중", sent: "카톡 보냄", failed: "카톡 실패" };
const KIND_LABEL = { before: "전날 알림 ", day: "당일 알림 ", late1: "독촉 1 ", late2: "독촉 2 ", late3: "독촉 3 " };
const sendLine = id => sends.filter(x => x.order_id === id).map(x => `${KIND_LABEL[x.kind] || ""}${esc(x.person)}: ${SEND_LABEL[x.state]}${x.note ? " (" + esc(x.note) + ")" : ""}`).join(" · ");
// 지시와 보고를 다시 불러온다. 바뀐 것이 있을 때만 화면을 다시 그린다.
let lastRaw = "", loadSeq = 0;
async function refresh(redraw = true){
  const seq = ++loadSeq;
  if (!me || !pin) return;
  const j = await rpc("wo_load", { p_name: me, p_pin: pin });
  if (seq !== loadSeq) return;
  if (j.r === "locked") throw new Error("locked");
  if (j.r !== "ok"){ const who = me; logout(); pickPin(who, "비밀번호가 바뀌었습니다. 다시 넣어 주세요."); return; }
  const os = j.orders, rs = j.reports, ss = j.sends; staff = j.staff || []; options = j.options || []; routines = j.routines || [];
  const first = !loaded.o, raw = JSON.stringify([os, rs, ss, staff, routines]);
  loaded.o = loaded.r = true; slow = false;
  if (raw === lastRaw && !first) return;
  lastRaw = raw; orders = os; reports = rs; sends = ss;
  if (redraw) rerenderData();
}
const BOSS = "신충기 이사";
const TEAMS = {
  "사무팀": ["최규수","권상훈","허강현","임주현"],
  "조리팀": ["박한설","오진섭"],
  "전처리팀": ["배성대"],
  "물류팀": ["명노건"],
  "포장팀": ["김성주"]
};
const TEAM_OF = {}; for (const [t, ps] of Object.entries(TEAMS)) ps.forEach(p => TEAM_OF[p] = t);
const TYPES = ["조리·생산","입고·발주·재고","위생·청소·안전","배송·사무·보고"];
const PRIOS = ["긴급","높음","보통"];
const PURPOSES = ["생산 일정 맞추기","위생 기준 지키기","안전사고 예방","고객·거래처 요청 대응","재고·발주 정확도","비용 절감","품질 개선"];
const COOPS = ["다른 팀과 협조 필요","작업 전 지시자와 상의","관련 서류·사진 확인","거래처 연락 필요","특이사항 없음"];
const MUSTS = ["비용 발생 시 사전승인","중간보고","완료보고"];
const STATUSES = ["접수","진행중","완료","문제발생"];

let me = null, pin = null, asking = null, staff = [], options = [], routines = [], rtForm = false, rtDel = null, boardM = null, boardDay = null, issued = {}, orders = [], reports = [], loaded = {o:false,r:false}, slow = false;
let adminTab = "list", filter = "전체", openId = null, lastSaved = null, confirmDel = null;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DOW = "일월화수목금토";
const md = d => `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`;
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fmtTime = ms => { const d = new Date(ms); return `${md(d)} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
const orderNo = o => { const d = new Date(o.createdAt); return `${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}-${o.id.slice(-3).toUpperCase()}`; };
const statusOf = o => o.status || "대기";
const linkFor = o => PAGE_URL + "#" + o.id;

function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2200); }
function store(k, v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch(e){} }
function load(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }

async function copyText(text){
  try { await navigator.clipboard.writeText(text); toast("복사했습니다. 카톡에 붙여넣으세요."); return true; }
  catch(e){
    const box = $("#copybox");
    if (box){ const r = document.createRange(); r.selectNodeContents(box); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    toast("자동 복사가 막혔습니다. 선택된 글을 길게 눌러 복사하세요."); return false;
  }
}

function kakaoText(o){
  const lines = [
    `[업무지시] No.${orderNo(o)}`,
    `받는 사람: ${o.assignees.join(", ")}`,
    `업무: ${o.title} (${o.type})`,
    `기한: ${o.dueLabel} · 우선순위: ${o.priority}`
  ];
  if (o.purposes?.length) lines.push(`목적·이유: ${o.purposes.join(", ")}`);
  if (o.coops?.length) lines.push(`협조·참고: ${o.coops.join(", ")}`);
  if (o.memo) lines.push(`메모: ${o.memo}`);
  if (o.musts?.length) lines.push(`꼭 지킬 것: ${o.musts.join(" / ")}`);
  lines.push(`지시: ${o.createdBy}`);
  lines.push(``, `▶ 확인·보고하기 (이름 선택 후 보고)`, linkFor(o));
  return lines.join("\n");
}

/* ---------- header ---------- */
function renderWho(){
  $("#who").innerHTML = me
    ? `<span><b>${esc(me)}</b>${me === BOSS ? ' <span class="muted small">지시자</span>' : ` <span class="muted small">${esc(TEAM_OF[me]||"")}</span>`}</span><button class="ghost" id="switch">이름 바꾸기</button>`
    : "";
  const b = $("#switch"); if (b) b.onclick = () => { logout(); render(); };
}

/* ---------- name select ---------- */
function renderPick(){
  let h = `<div class="stack"><div><h2>나는 누구인가요?</h2><p class="muted small" style="margin:4px 0 0">이름을 누르면 내 화면으로 갑니다. 이 기기에서는 다음에도 기억합니다.</p></div>`;
  h += `<div class="names"><button class="boss" data-name="${esc(BOSS)}"><b>${esc(BOSS)}</b><small>지시 작성·관리</small></button></div>`;
  for (const [t, ps] of Object.entries(TEAMS)){
    h += `<div class="team-block"><div class="tn">${esc(t)}</div><div class="names">${ps.map(p => `<button data-name="${esc(p)}"><b>${esc(p)}</b><small>내 지시 보기</small></button>`).join("")}</div></div>`;
  }
  h += `</div>`;
  $("#app").innerHTML = h;
  $("#app").querySelectorAll("[data-name]").forEach(b => b.onclick = () => pickPin(b.dataset.name));
}

/* ---------- password ---------- */
const PIN_MSG = { bad: "비밀번호가 맞지 않습니다.", locked: "여러 번 틀려 잠겼습니다. 10분 뒤 다시 하세요.", length: "숫자 6~12자리로 정해 주세요.", same: "받은 번호와 다른 번호로 정해 주세요." };
function logout(){
  loadSeq++; me = pin = asking = null; orders = []; reports = []; sends = []; staff = []; options = []; issued = {};
  loaded = { o:false, r:false }; lastRaw = ""; lastSaved = null; confirmDel = null;
  store("wo-me", null); store("wo-pin", null);
  wkSeq++; wkRows = []; wkForm = null; wkState = "idle"; wkKind = "day"; wkDay = null; staffTab = "orders"; adminTab = "list";
  try { Object.keys(localStorage).filter(k => k.startsWith("wo-draft-")).forEach(k => localStorage.removeItem(k)); } catch(e){}   // 다른 사람이 쓰던 글을 못 보게
}
function enter(name, p){
  me = name; pin = p; asking = null; store("wo-me", me); store("wo-pin", pin);
  render(); refresh().catch(() => {});
}
function pinField(id, label, hint){
  return `<div class="field"><label for="${id}">${label} <span class="hint">${hint}</span></label><input type="password" id="${id}" maxlength="64" autocomplete="off"></div>`;
}
function pickPin(name, note = ""){
  asking = name; renderWho();
  $("#app").innerHTML = `<form class="stack" id="pf" novalidate><div><h2>${esc(name)}</h2></div><div class="panel stack">${pinField("pin", "비밀번호", "이 기기에서 처음 한 번만")}
    <div class="row"><button class="primary" type="submit" id="go">들어가기</button><button type="button" class="ghost" id="back">이름 다시 고르기</button></div><span class="muted small" id="err">${esc(note)}</span></div></form>`;
  $("#back").onclick = () => { asking = null; render(); };
  $("#pin").focus();
  $("#pf").onsubmit = async e => {
    e.preventDefault(); const p = $("#pin").value, err = $("#err"); $("#go").disabled = true;
    try {
      const a = await rpc("wo_login", { p_name: name, p_pin: p });
      if (asking !== name) return;
      if (a === "ok") return enter(name, p);
      if (a === "change") return newPin(name, p);
      err.textContent = a === "unset" ? (name === BOSS ? "비밀번호를 아직 정하지 않았습니다. 맥북에서 먼저 정해 주세요." : "아직 첫 번호가 없습니다. 이사님께 받아 주세요.") : (PIN_MSG[a] || "들어가지 못했습니다.");
    } catch(x){ err.textContent = "연결하지 못했습니다. 인터넷을 확인해 주세요."; }
    $("#go").disabled = false;
  };
}
function newPin(name, old){

  if (!st){ toast("상태(접수·진행중·완료·문제발생)를 먼저 고르세요."); return; }
  const memo = (document.getElementById("memo-"+id)?.value || "").trim();
  btn.disabled = true;
  try {
    if (await rpc("wo_report_pin", { p_order: id, p_name: me, p_pin: pin, p_status: st, p_memo: memo }) !== "ok") throw 0;
    await refresh(false).catch(() => {});
    openId = id; toast("보고를 보냈습니다."); render();
  } catch(e){ toast("보고를 저장하지 못했습니다. 인터넷 연결을 확인하고 다시 눌러 주세요."); btn.disabled = false; }

function dueOptions(){
  const t = new Date(); const d1 = new Date(t); d1.setDate(t.getDate()+1);
  const fri = new Date(t); fri.setDate(t.getDate() + ((5 - t.getDay() + 7) % 7));
  return [
    { v:"today", label:`오늘 ${md(t)}`, date: ymd(t) },
    { v:"tomorrow", label:`내일 ${md(d1)}`, date: ymd(d1) },
    { v:"week", label:`이번 주 금요일 ${md(fri)}`, date: ymd(fri) },
    { v:"pick", label:"날짜 지정" }
  ];
}
const chipGroup = (name, opts, type, checked=[]) => `<div class="chips">${opts.map((o,i) => {
  const v = typeof o === "string" ? o : o.v, l = typeof o === "string" ? o : o.label;
  return `<label class="chip"><input type="${type}" name="${name}" id="${name}-${i}" value="${esc(v)}" ${checked.includes(v)?"checked":""}><span>${esc(l)}</span></label>`; }).join("")}</div>`;

// 기타: 이사님이 직접 만든 항목. 저장해 두고 다음에도 고를 수 있다
const BASE = { type: TYPES, purpose: PURPOSES, coop: COOPS, must: MUSTS };
const ownList = k => options.filter(x => x.kind === k).map(x => x.label).filter(l => !BASE[k].includes(l));
const ownGroup = (k, base, type, checked) => `<div data-own="${k}" data-type="${type}">${chipGroup(k, [...base, ...ownList(k)], type, checked)}<div class="row" style="margin-top:8px;gap:8px"><button type="button" class="ghost small" data-ownadd>+ 기타 만들기</button></div></div>`;
function bindOwn(box){
  const k = box.dataset.own, type = box.dataset.type;
  const redraw = pick => {
    const on = [...box.querySelectorAll(`input[name=${k}]:checked`)].map(i => i.value).filter(v => type !== "radio" || !pick);
    if (pick) on.push(pick);
    box.outerHTML = ownGroup(k, BASE[k], type, on); bindOwn(document.querySelector(`[data-own="${k}"]`));
  };
  box.querySelector("[data-ownadd]").onclick = () => {
    const row = box.lastElementChild, mine = ownList(k);
    row.style.flexWrap = "wrap";
    row.innerHTML = `<input type="text" maxlength="20" aria-label="새 항목 이름" placeholder="새 항목 이름(20자까지)" style="flex:1;min-width:160px"><button type="button" data-ok>추가</button><button type="button" class="ghost" data-no>닫기</button>
      ${mine.length ? `<div class="row" style="width:100%;gap:8px;flex-wrap:wrap"><span class="muted small">만든 항목 지우기</span>${mine.map(l => `<button type="button" class="ghost small" data-rm="${esc(l)}">${esc(l)} ✕</button>`).join("")}</div>` : ""}`;
    const inp = row.querySelector("input"); inp.focus();
    const send = async (label, add, b) => {
      b.disabled = true;
      try {
        const a = await rpc("wo_option", { p_boss: pin, p_kind: k, p_label: label, p_add: add });
        if (a !== "ok"){ toast(a === "full" ? "30개까지만 만들 수 있습니다." : "저장하지 못했습니다."); b.disabled = false; return; }
        options = options.filter(x => !(x.kind === k && x.label === label)); if (add) options.push({ kind: k, label });
        redraw(add ? label : null);
      } catch(e){ toast("저장하지 못했습니다. 인터넷을 확인하세요."); b.disabled = false; }
    };
    const add = () => {
      const l = inp.value.trim().replace(/\s+/g, " "); if (!l) return inp.focus();
      if (BASE[k].includes(l) || mine.includes(l)) return redraw(l);
      send(l, true, row.querySelector("[data-ok]"));
    };
    row.querySelector("[data-ok]").onclick = add;
    inp.onkeydown = e => { if (e.key === "Enter"){ e.preventDefault(); if (!e.isComposing) add(); } };
    row.querySelector("[data-no]").onclick = () => redraw(null);
    row.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => send(b.dataset.rm, false, b));
  };
}

/* ---------- 업무보고(일·주·월) ---------- */
const WK_KIND = { day: "일일", week: "주간", month: "월간" };
const WK_TEAMS = ["전처리", "조리", "포장", "구매", "검수", "사무"];
const WK_QTY = [["raw", "원물 중량(kg, 1박스)"], ["price", "박스 매입가(원)"], ["work", "실제 작업량(kg)"], ["out", "최종 생산량(kg)"]];
const WK_PEOPLE = ["총원", "풀타임", "하프", "옥상"];
function wkFields(name, kind){
  const N = { day: ["오늘 한 일", "내일 할 일"], week: ["이번 주 한 일", "다음 주 할 일"], month: ["이번 달 한 일", "다음 달 할 일"] }[kind];
  const X = { "최규수": [["safe", "안전·위생·시설"], ["teams", "팀별 보고"]], "배성대": [["sum", "작업량·원가 합계"], ["talk", "개인 면담", "이사님만 봅니다"]],
    "박한설": [["vendor", "거래처·설비"], ["menu", "생산 메뉴"]], "허강현": [["store", "매장별 보고"]] }[name] || [];
  return [["done", N[0]], ...X.filter(x => !(kind === "day" && (x[0] === "teams" || x[0] === "sum"))), ["doing", "진행 중 업무"], ["issue", "문제·요청"], ["next", N[1]]];
}
const wkDate = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, m-1, d); };
const wkStart = (kind, d) => kind === "day" ? new Date(d.getFullYear(), d.getMonth(), d.getDate()) : kind === "week" ? new Date(d.getFullYear(), d.getMonth(), d.getDate() - (d.getDay() + 6) % 7) : new Date(d.getFullYear(), d.getMonth(), 1);
const wkMove = (kind, d, n) => kind === "day" ? new Date(d.getFullYear(), d.getMonth(), d.getDate() + n) : kind === "week" ? new Date(d.getFullYear(), d.getMonth(), d.getDate() + 7*n) : new Date(d.getFullYear(), d.getMonth() + n, 1);
const wkEnd = (kind, d) => { const e = wkMove(kind, d, 1); e.setDate(e.getDate() - 1); return e; };
const wkTitle = (kind, d) => kind === "day" ? md(d) : kind === "week" ? `${md(d)} ~ ${md(wkEnd(kind, d))}` : `${d.getFullYear()}년 ${d.getMonth()+1}월`;
const wkNum = v => { const n = Number(String(v ?? "").replace(/[,\s]/g, "")); return String(v ?? "").trim() && isFinite(n) && n >= 0 ? n : null; };
const wkWon = n => Math.round(n).toLocaleString("ko-KR");
const wkKg = n => Number(n.toFixed(2)).toLocaleString("ko-KR");
function wkCalc(q){
  const raw = wkNum(q.raw), price = wkNum(q.price), work = wkNum(q.work), out = wkNum(q.out), r = {};
  if (raw && price != null) r.unit = price / raw;
  if (r.unit != null && work != null) r.cost = r.unit * work;
  if (work && out != null){ r.up = out - work; r.times = out / work; }
  if (r.cost != null && out) r.per = r.cost / out;
  return r;
}
function wkCalcLines(q){
  const r = wkCalc(q), L = [];
  if (r.unit != null) L.push(`원물 kg당 단가: ${wkWon(r.unit)}원`);
  if (r.cost != null) L.push(`실제 투입 원물비: ${wkWon(r.cost)}원`);
  if (r.up != null) L.push(`중량 증가량: ${wkKg(r.up)}kg`, `중량 증가 배율: ${wkKg(r.times)}배`);
  if (r.per != null) L.push(`생산품 kg당 원물 원가: ${wkWon(r.per)}원`);
  return L;
}
// 보고 한 건을 글로 만든다. 빈 칸은 뺀다
function wkSections(name, kind, b){
  const f = b?.f || {}, S = [], t = v => String(v ?? "").trim();
  if (kind === "day"){
    const p = WK_PEOPLE.filter(k => t(b?.n?.[k])).map(k => `${k} ${t(b.n[k])}명`); if (p.length) S.push(["인원", p.join(" · ")]);
  }
  for (const [k, l] of wkFields(name, kind)){
    if (t(f[k])) S.push([l, t(f[k])]);
    if (k === "done" && kind === "day" && Array.isArray(b?.q)){
      const a = b.q.filter(q => t(q?.name)).map(q => [`■ ${t(q.name)}`, ...WK_QTY.filter(x => t(q[x[0]])).map(x => { const m = x[1].match(/^(.*)\((kg|원)/), v = wkNum(q[x[0]]); return `- ${m[1]}: ${v == null ? t(q[x[0]]) : m[2] === "원" ? wkWon(v) : wkKg(v)}${m[2]}`; }), ...wkCalcLines(q).map(x => "- " + x), ...(t(q.memo) ? ["- " + t(q.memo)] : [])].join("\n"));
      if (a.length) S.push(["작업량·원가", a.join("\n\n")]);
    }
    if (k === "safe" && kind === "day"){
      const a = WK_TEAMS.filter(x => t(b?.t?.[x])).map(x => `[${x}] ${t(b.t[x])}`); if (a.length) S.push(["팀별 보고", a.join("\n")]);
    }
  }
  return S;
}
const wkText = r => [`[${WK_KIND[r.kind]}보고] ${wkTitle(r.kind, wkDate(r.day))} ${r.person}`, ...wkSections(r.person, r.kind, r.body).map(([l, v]) => `\n▶ ${l}\n${v}`)].join("\n");
// 주간은 일일을, 월간은 주간(없는 주는 일일)을 모아 초안을 만든다
function wkAuto(kind){
  const days = wkRows.filter(r => r.kind === "day" && r.person === me);
  const weeks = kind === "month" ? wkRows.filter(r => r.kind === "week" && r.person === me) : [];
  const src = [...weeks, ...days.filter(r => !weeks.some(w => w.day === ymd(wkStart("week", wkDate(r.day)))))].sort((a, b) => a.day < b.day ? -1 : 1);
  const f = {};
  for (const [k] of wkFields(me, kind)){
    const L = [];
    for (const r of src){
      let v = String(r.body?.f?.[k] ?? "").trim();
      if (k === "teams" && r.kind === "day") v = WK_TEAMS.filter(x => { const s = String(r.body?.t?.[x] ?? "").trim(); return s && s !== "이상없음"; }).map(x => `[${x}] ${r.body.t[x]}`).join("\n");
      if (v) L.push(`${wkTitle(r.kind, wkDate(r.day))}\n${v}`);
    }
    f[k] = (k === "next" || k === "doing" ? L.slice(-1) : L).join("\n\n");
  }
  if (me === "배성대"){
    const m = new Map();
    for (const r of days) for (const q of Array.isArray(r.body?.q) ? r.body.q : []){
      const n = String(q?.name ?? "").trim(); if (!n) continue;
      const o = m.get(n) || { work: 0, out: 0, cost: 0, all: true }, c = wkCalc(q).cost;
      o.work += wkNum(q.work) || 0; o.out += wkNum(q.out) || 0; if (c == null) o.all = false; else o.cost += c;
      m.set(n, o);
    }
    f.sum = [...m].map(([n, o]) => `${n}: 작업량 ${wkKg(o.work)}kg, 생산량 ${wkKg(o.out)}kg` + (o.cost ? `, 투입 원물비 ${wkWon(o.cost)}원${o.all ? (o.out ? ` (kg당 ${wkWon(o.cost / o.out)}원)` : "") : " (가격 적은 날만)"}` : "")).join("\n");
  }

}
let staffTab = "orders", wkKind = "day", wkDay = null, wkRows = [], wkState = "idle", wkSeq = 0, wkForm = null;
const wkKey = () => `wo-draft-${me}-${wkKind}-${ymd(wkDay)}`;
async function wkLoad(){

    if (seq !== wkSeq || who !== me) return;
    if (j.r !== "ok") throw 0;
    wkRows = j.rows; wkState = "ok";
  } catch(e){ if (seq !== wkSeq || who !== me) return; wkRows = []; wkState = "fail"; }
  wkDraw();
}
function wkDraw(){
  const root = $("#wk"); if (!root) return;
  const isBoss = me === BOSS, today = wkStart(wkKind, new Date());
  let h = `<div class="stack"><div class="chips">${Object.entries(WK_KIND).map(([k, l]) => `<label class="chip"><input type="radio" name="wkkind" value="${k}" ${k === wkKind ? "checked" : ""}><span>${l}</span></label>`).join("")}</div>
    <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><button type="button" data-wkmv="-1" aria-label="이전">◀</button><h2 style="text-align:center;font-size:19px">${wkTitle(wkKind, wkDay)}</h2><button type="button" data-wkmv="1" aria-label="다음" ${wkDay >= today ? "disabled" : ""}>▶</button></div>`;
  if (wkState === "loading") h += `<div class="empty">불러오는 중입니다…</div>`;
  else if (wkState === "fail") h += `<div class="banner">보고를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.</div><button type="button" id="wkretry">다시 불러오기</button>`;
  else h += isBoss ? wkBossHTML() : wkStaffHTML();
  root.innerHTML = h + `</div>`;
  root.querySelectorAll("[name=wkkind]").forEach(i => i.onchange = () => { wkKind = i.value; wkDay = wkStart(wkKind, new Date()); wkLoad(); });
  root.querySelectorAll("[data-wkmv]").forEach(b => b.onclick = () => { wkDay = wkMove(wkKind, wkDay, Number(b.dataset.wkmv)); wkLoad(); });
  const rt = $("#wkretry"); if (rt) rt.onclick = wkLoad;
  if (wkState === "ok") isBoss ? wkBossBind(root) : wkStaffBind(root);
}
const wkView = r => wkSections(r.person, r.kind, r.body).map(([l, v]) => `<div><b style="color:var(--accent)">▶ ${esc(l)}</b><div style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(v)}</div></div>`).join("") || `<div class="muted">적은 내용이 없습니다.</div>`;
function wkBossHTML(){
  const rows = wkRows.filter(r => r.kind === wkKind), names = Object.keys(TEAM_OF), miss = names.filter(n => !rows.some(r => r.person === n));
  return `<div class="panel" style="padding:14px"><b>낸 사람 ${rows.length}명 · 안 낸 사람 ${miss.length}명</b>${miss.length ? `<div class="muted small">안 냄: ${miss.map(esc).join(", ")}</div>` : ""}</div>` +
    (rows.length ? names.flatMap(n => rows.filter(r => r.person === n)).map(r => `<details class="ticket" open><summary><span class="tt">${esc(r.person)} <span class="muted small">${esc(TEAM_OF[r.person])}</span></span><span class="small muted">${fmtTime(r.up)}${r.edited ? " 고침" : ""}</span></summary>
      <div class="body">${wkView(r)}<div class="row"><button type="button" data-wkcopy="${esc(r.person)}">글 복사</button></div></div></details>`).join("") : `<div class="empty">아직 낸 보고가 없습니다.</div>`);
}
function wkBossBind(root){
  root.querySelectorAll("[data-wkcopy]").forEach(b => b.onclick = () => copyText(wkText(wkRows.find(r => r.kind === wkKind && r.person === b.dataset.wkcopy))));
}
function wkInit(){
  const saved = wkRows.find(r => r.kind === wkKind && r.person === me);
  let d = null; try { d = JSON.parse(load(wkKey())); } catch(e){}
  const b = d || saved?.body || (wkKind === "day" ? {} : wkAuto(wkKind));
  return { from: d ? "draft" : saved ? "saved" : wkKind === "day" ? "new" : "auto", body: JSON.parse(JSON.stringify({ f: b.f || {}, n: b.n || {}, t: b.t || {}, q: Array.isArray(b.q) ? b.q : [] })) };
}
const wkQty = (q, i) => `<div class="panel stack" style="padding:12px;gap:10px" data-q="${i}"><div class="row" style="flex-wrap:nowrap"><input type="text" data-qk="name" maxlength="40" placeholder="품목 (예: 목이버섯)" aria-label="품목" value="${esc(q.name)}"><button type="button" class="ghost" data-qdel="${i}" style="flex:none">빼기</button></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end">${WK_QTY.map(([k, l]) => `<label class="small">${l}<input type="text" inputmode="decimal" data-qk="${k}" maxlength="15" value="${esc(q[k])}"></label>`).join("")}</div>
  <input type="text" data-qk="memo" maxlength="80" placeholder="메모 (예: 45팩, 2kg)" aria-label="메모" value="${esc(q.memo)}"><div class="small" data-qout style="white-space:pre-line">${esc(wkCalcLines(q).join("\n"))}</div></div>`;
function wkStaffHTML(){
  wkForm = wkForm || wkInit();
  const { body: b, from } = wkForm, saved = wkRows.find(r => r.kind === wkKind && r.person === me), day = wkKind === "day";
  let h = `<div class="small ${from === "draft" ? "banner" : "muted"}">${from === "draft" ? "쓰던 글입니다. 아직 내지 않았습니다." : saved ? `냈습니다 · ${fmtTime(saved.up)} (고쳐서 다시 낼 수 있습니다)` : from === "auto" ? "그동안 낸 보고를 모아 초안을 만들었습니다. 고쳐서 내세요." : "쓸 내용이 있는 칸만 적으면 됩니다."}${!saved ? "" : from === "draft" ? ` <span>지난번 낸 때: ${fmtTime(saved.up)}</span>` : ""}</div><form id="wkf" class="stack">`;
  if (day && me === "배성대") h += `<div class="field"><span class="lab">인원</span><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">${WK_PEOPLE.map(k => `<label class="small">${k}<input type="text" inputmode="numeric" maxlength="4" data-n="${k}" value="${esc(b.n[k])}"></label>`).join("")}</div></div>`;
  for (const [k, l, hint] of wkFields(me, wkKind)){
    h += `<div class="field"><label for="wk-${k}">${l}${hint ? ` <span class="hint">${hint}</span>` : ""}</label><textarea id="wk-${k}" data-f="${k}" maxlength="4000" rows="${Math.min(14, Math.max(3, String(b.f[k] ?? "").split("\n").length + 1))}">${esc(b.f[k])}</textarea></div>`;
    if (k === "done" && day && me === "배성대") h += `<div class="field"><span class="lab">작업량·원가 <span class="hint">나머지는 자동 계산</span></span>${b.q.map(wkQty).join("")}<button type="button" id="wkqadd" ${b.q.length >= 20 ? "disabled" : ""}>+ 품목 더하기</button></div>`;
    if (k === "safe" && day) h += `<div class="field"><span class="lab">팀별 보고</span><button type="button" id="wkok">빈 칸에 모두 '이상없음' 넣기</button>${WK_TEAMS.map(x => `<label class="small">${x}<input type="text" data-t="${x}" maxlength="500" value="${esc(b.t[x])}"></label>`).join("")}</div>`;
  }
  return h + `<button type="submit" class="primary">${saved ? "고쳐서 다시 내기" : `${WK_KIND[wkKind]}보고 내기`}</button>${!day && wkForm.from !== "auto" ? `<button type="button" id="wkauto">낸 보고로 초안 다시 만들기</button>` : ""}${from === "draft" ? `<button type="button" id="wkdrop">쓰던 글 버리기</button>` : ""}</form>`;
}
function wkStaffBind(root){
  const b = wkForm.body, key = wkKey(), keep = () => { wkForm.touched = true; store(key, JSON.stringify(b)); };
  root.querySelectorAll("[data-f]").forEach(x => x.oninput = () => { b.f[x.dataset.f] = x.value; keep(); });
  root.querySelectorAll("[data-n]").forEach(x => x.oninput = () => { b.n[x.dataset.n] = x.value; keep(); });
  root.querySelectorAll("[data-t]").forEach(x => x.oninput = () => { b.t[x.dataset.t] = x.value; keep(); });
  root.querySelectorAll("[data-qk]").forEach(x => x.oninput = () => { const p = x.closest("[data-q]"), q = b.q[p.dataset.q]; q[x.dataset.qk] = x.value; p.querySelector("[data-qout]").textContent = wkCalcLines(q).join("\n"); keep(); });
  root.querySelectorAll("[data-qdel]").forEach(x => x.onclick = () => { b.q.splice(Number(x.dataset.qdel), 1); keep(); wkDraw(); });
  const on = (id, fn) => { const x = root.querySelector(id); if (x) x.onclick = fn; };
  on("#wkqadd", () => { b.q.push({}); keep(); wkDraw(); });
  on("#wkok", () => { WK_TEAMS.forEach(x => { if (!String(b.t[x] ?? "").trim()) b.t[x] = "이상없음"; }); keep(); wkDraw(); });
  on("#wkauto", () => { wkForm = { from: "auto", body: wkAuto(wkKind) }; store(key, JSON.stringify(wkForm.body)); wkDraw(); });
  on("#wkdrop", () => { store(key, null); wkForm = null; wkDraw(); });
  root.querySelector("#wkf").onsubmit = async e => {
    e.preventDefault();
    if (!wkSections(me, wkKind, b).length) return toast("한 칸 이상 적어 주세요.");
    if (b.q.some(q => !String(q.name ?? "").trim() && Object.values(q).some(v => String(v ?? "").trim()))) return toast("작업량·원가에 품목 이름을 적어 주세요.");
    const btn = e.target.querySelector("[type=submit]"), seq = wkSeq, who = me; btn.disabled = true;
    const sent = JSON.stringify(b);
    try {
      const r = await rpc("wo_work_save", { p_name: me, p_pin: pin, p_kind: wkKind, p_day: ymd(wkDay), p_body: JSON.parse(sent) });
      if (r === "invalid"){ btn.disabled = false; return toast("저장할 수 없습니다. 두 달이 지났거나 글이 너무 깁니다."); }
      if (r !== "ok") throw 0;
      if (load(key) === sent || !wkForm?.touched) store(key, null);   // 보내는 사이 더 쓴 글은 남긴다
      toast("보고를 냈습니다.");
      if (seq === wkSeq && who === me) { scrollTo(0, 0); wkLoad(); }
    } catch(err){ btn.disabled = false; toast("보고를 저장하지 못했습니다. 쓰던 글은 남아 있습니다. 다시 눌러 주세요."); }
  };
}
function wkOpen(root){ root.innerHTML = `<div id="wk"></div>`; if (wkState === "idle") wkLoad(); else wkDraw(); }

/* ---------- main ---------- */
function render(){
  renderWho();
  if (!me) return asking ? pickPin(asking) : renderPick();
  if (me === BOSS) return renderAdmin();
  return renderStaff();
}
function rerenderData(){
  // keep the form intact while the boss is typing
  if (me === BOSS && adminTab === "new"){ const t = document.getElementById("tab-list"); if (t) t.textContent = `지시 목록 (${orders.length})`; return; }
  if (me === BOSS && adminTab === "routine" && rtForm) return; // 루틴 쓰는 중
  if (me && (me === BOSS ? adminTab : staffTab) === "work") return; // 업무보고 보는 중·쓰는 중
  // keep a half-typed report memo
  const active = document.activeElement; if (active && active.id?.startsWith("memo-") && active.value) return;
  if (document.querySelector('input[name^="st-"]:checked')) return;
  if (me) render();
}

function initHash(){ const h = location.hash.slice(1); if (h && /^o[a-z0-9]+$/.test(h)){ openId = h; adminTab = "list"; staffTab = "orders"; } }
window.addEventListener("hashchange", () => { initHash(); if (me) render(); });

(async function start(){
  initHash();
  const saved = load("wo-me"); if (saved && load("wo-pin") && (saved === BOSS || TEAM_OF[saved])){ me = saved; pin = load("wo-pin"); }
  render();
  const timer = setTimeout(() => { if (me && !loaded.o) { slow = true; rerenderData(); } }, 10000);
  const tick = () => refresh().then(() => clearTimeout(timer)).catch(() => {});
  await tick();
  setInterval(() => { if (!document.hidden) tick(); }, 10000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
})();
</script>
</body>
